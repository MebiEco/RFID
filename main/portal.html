<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Máy chấm công</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0b1220;color:#e5e7eb;min-height:100vh;line-height:1.45;font-size:14px}
.wrap{display:flex;min-height:100vh}
.side{width:200px;background:#111827;border-right:1px solid #1f2937;padding:16px 0;flex-shrink:0;display:flex;flex-direction:column}
.side h2{font-size:13px;text-align:center;margin:0 10px 14px;color:#a5b4fc;letter-spacing:.5px}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.nav a{display:block;padding:10px 12px;color:#9ca3af;text-decoration:none;border-radius:6px;cursor:pointer}
.nav a:hover{color:#fff;background:#1f2937}
.nav a.on{color:#fff;background:#3730a3}
.main{flex:1;padding:20px;overflow:auto}
.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:18px;max-width:820px;margin:0 auto}
h1{font-size:18px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #334155}
label{display:block;margin:12px 0 4px;font-size:12px;color:#cbd5e1}
input:not([type=radio]):not([type=checkbox]),select{width:100%;padding:9px 11px;background:#0f172a;border:1px solid #374151;border-radius:6px;font-size:14px;color:#fff}
.btn,.btn-sm{display:inline-block;padding:9px 14px;border:0;border-radius:6px;background:#4f46e5;color:#fff;font-weight:600;font-size:13px;cursor:pointer;margin:8px 6px 0 0}
.btn.red,.btn-sm.red{background:#dc2626}
.btn.green,.btn-sm.green{background:#059669}
.btn:disabled{opacity:.5}
.btn-sm{padding:5px 10px;font-size:12px}
.msg{margin-top:8px;min-height:18px}
.msg.success{color:#34d399}.msg.error{color:#f87171}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.tbl th{background:#0f172a;color:#9ca3af;font-size:11px;padding:8px 10px;text-align:left}
.tbl td{padding:8px 10px;border-bottom:1px solid #1f2937}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:99}
.ov.show{display:flex}
.pinbox{background:#1e293b;border:1px solid #334155;padding:20px;border-radius:10px;width:90%;max-width:360px}
.hint{font-size:12px;color:#9ca3af;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.sc{background:#151f32;border:1px solid #1f2937;border-radius:8px;padding:12px}
.sc h3{font-size:11px;color:#9ca3af;text-transform:uppercase;margin-bottom:4px}
.sc .v{font-weight:600;margin-bottom:4px}
.att-sum{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.att-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:#0f172a;border:1px solid #1f2937;border-radius:6px;font-size:12px;white-space:nowrap}
.att-chip .k{color:#9ca3af;text-transform:uppercase;font-size:10px;letter-spacing:.3px}
.att-chip .n{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.badge,.sb{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:600}
.sb.ok,.badge.save{background:#064e3b;color:#34d399}
.sb.warn{background:#78350f;color:#fbbf24}
.sb.bad,.badge.del{background:#7f1d1d;color:#f87171}
.badge.swipe{background:#1e3a8a;color:#93c5fd}
#wlist{list-style:none;margin-top:10px}
#wlist li{background:#151f32;border:1px solid #1f2937;padding:8px 12px;border-radius:6px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.spin{width:16px;height:16px;border:2px solid #334155;border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.lcd-opt{display:flex;gap:10px;margin:10px 0;padding:12px;border:1px solid #334155;border-radius:8px;cursor:pointer}
.lcd-opt.sel{border-color:#6366f1;background:#1e1b4b}
.term-box{background:#0c0c0c;font-family:Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:12px;line-height:1.35;padding:12px;border-radius:8px;border:1px solid #334155;height:450px;overflow:auto;white-space:pre-wrap;color:#cccccc;margin:12px 0}
/* Khop IDF Monitor (Windows Terminal Campbell): I xanh la, W vang, E do */
.te{color:#e74856}.tw{color:#f9f1a5}.ti{color:#16c60c}.td{color:#3b78ff}.tv{color:#767676}
.te .lv,.tw .lv,.ti .lv,.td .lv,.tv .lv{font-weight:700}
.bar-row{margin:10px 0 14px}.bar-meta{display:flex;justify-content:space-between;font-size:12px;color:#9ca3af;margin-bottom:4px}
.bar-meta b{color:#e5e7eb;font-weight:600}.bar{height:10px;background:#0f172a;border:1px solid #334155;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:#34d399}
.bar>i.warn{background:#fbbf24}.bar>i.bad{background:#f87171}
.att-block{margin-top:16px;padding:14px;background:#151f32;border:1px solid #1f2937;border-radius:8px}
.att-block h3{position:sticky;top:0;z-index:2;font-size:14px;margin:0;padding:8px 0 6px;background:#151f32}
.att-block .sub{font-size:12px;color:#9ca3af;margin-bottom:10px}
.att-head{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:4px 0 8px;margin:0 0 4px;background:#151f32;border-bottom:1px solid #1f2937}
.att-lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}
.att-list{background:#0f172a;border:1px solid #1f2937;border-radius:6px;padding:0;max-height:160px;overflow:auto;font-size:12px}
.att-list h4{position:sticky;top:0;z-index:1;font-size:11px;color:#9ca3af;text-transform:uppercase;margin:0;padding:8px 8px 6px;background:#0f172a;border-bottom:1px solid #1f2937}
.att-list ul{margin:0;padding:0 8px 8px}
.att-list li{display:flex;align-items:baseline;gap:6px;padding:4px 0;border-bottom:1px solid #1f2937;list-style:none}
.att-list .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-list .t{color:#38bdf8;flex-shrink:0;font-variant-numeric:tabular-nums}
.m-hdr{display:none;background:#111827;border-bottom:1px solid #1f2937;height:52px;align-items:center;padding:0 12px;position:sticky;top:0;z-index:90}
.m-hdr h2{font-size:14px;color:#a5b4fc;margin:0 auto}
.m-hdr button{background:0;border:0;color:#9ca3af;font-size:22px;cursor:pointer;padding:6px}
.m-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:89}
@media(max-width:768px){
.m-hdr{display:flex}
.side{position:fixed;top:52px;left:0;bottom:0;transform:translateX(-100%);z-index:91;width:220px}
.side.show{transform:translateX(0)}
.m-ov.show{display:block}
.main{padding:12px}
}
</style></head><body>
<div class=m-hdr id=mHdr style=display:none><button id=mBtn type=button>☰</button><h2>MÁY CHẤM CÔNG</h2></div>
<div class=m-ov id=mOv></div>
<div class=wrap id=appLayout style=display:none>
<aside class=side id=sideMenu><h2>MÁY CHẤM CÔNG</h2><nav class=nav>
<a data-sec=home class=on>Tổng quan</a>
<a data-sec=wifi>WiFi</a>
<a data-sec=azure>Azure</a>
<a data-sec=log>Nhật ký</a>
<a data-sec=cards>DS thẻ</a>
<a data-sec=register>Đăng ký thẻ</a>
<a data-sec=pin>Đổi PIN</a>
<a data-sec=lcd>Màn hình</a>
<a data-sec=terminal>Log Terminal</a>
<a data-sec=hardware>Giám sát</a>
<a id=logoutBtn style=color:#f87171;margin-top:auto>Đăng xuất</a>
</nav></aside>
<main class=main><div class=card id=panel><h1 id=title>Trang chủ</h1><div id=body><p id=st>Đang tải...</p></div></div></main>
</div>
<div id=loginPage style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px">
<div class=card style="width:100%;max-width:360px">
<h2 style="text-align:center;margin-bottom:16px;color:#a5b4fc">ADMIN LOGIN</h2>
<label>Tài khoản</label><input id=luser autocomplete=username>
<label>Mật khẩu</label><input type=password id=lpass autocomplete=current-password>
<p class=msg id=lmsg></p>
<button class=btn id=lbtn style=width:100%>Đăng nhập</button>
</div></div>
<div class=ov id=pinOv><div class=pinbox>
<h3 id=pinTitle style=margin-bottom:10px>Nhập PIN</h3>
<input type=password id=pinIn maxlength=15 autocomplete=off>
<div style="margin-top:12px;display:flex;gap:8px"><button class=btn id=pinOk style=flex:1;margin:0>Xác nhận</button>
<button class=btn id=pinCancel style="flex:1;margin:0;background:#475569">Hủy</button></div>
<p class=hint>Sai PIN quá 5 lần sẽ bị khóa.</p>
</div></div>
<div class=ov id=regOv><div class=pinbox style=max-width:400px>
<h3 id=regTitle style=margin-bottom:10px>Đăng ký nhân viên</h3>
<label>Tên nhân viên</label><input id=regName autocomplete=off>
<label>Mã nhân viên</label><input id=regId autocomplete=off>
<div style="margin-top:14px;display:flex;gap:8px"><button class=btn id=regOk style=flex:1;margin:0>Lưu</button>
<button class=btn id=regCancel style="flex:1;margin:0;background:#475569">Hủy</button></div>
</div></div>
<script>
const T={home:'Tổng quan',wifi:'Cấu hình WiFi',azure:'Cấu hình Azure IoT',log:'Nhật ký hoạt động',cards:'Danh sách thẻ',register:'Đăng ký thẻ mới',pin:'Đổi mã PIN',lcd:'Cấu hình màn hình',terminal:'Log Terminal',hardware:'Giám sát phần cứng'};
let cur='home',tokens=JSON.parse(sessionStorage.getItem('portal_tokens')||'{}'),pendSec=null,pollTimer=null;
const tabCache={};const TAB_TTL={status:5000,attend:15000,azure:30000,screen:60000};
function tcGet(k){const e=tabCache[k];if(!e)return null;const ttl=TAB_TTL[k]||0;if(ttl&&Date.now()-e.t>ttl){delete tabCache[k];return null;}return e.d;}
function tcSet(k,d){tabCache[k]={t:Date.now(),d};}
function tcClr(k){if(k)delete tabCache[k];else for(const x in tabCache)delete tabCache[x];}
let logFilter={range:'today',from:'',to:'',code:'all',sort:'desc'};
let cardFilter={id:''};
function cardsQueryUrl(unreg,page){page=page||1;const p=new URLSearchParams();p.set('page',page);if(unreg)p.set('unreg','1');else if(cardFilter.id)p.set('id',cardFilter.id);return '/api/cards?'+p;}
function logSel(v,c){return v===c?' selected':'';}
function logQueryUrl(page){page=page||1;const p=new URLSearchParams();p.set('page',page);if(logFilter.range==='all')p.set('all','1');else if(logFilter.range==='7')p.set('days','7');else if(logFilter.range==='30')p.set('days','30');else if(logFilter.range==='custom'){if(logFilter.from)p.set('from',logFilter.from);if(logFilter.to)p.set('to',logFilter.to);}if(logFilter.code&&logFilter.code!=='all')p.set('code',logFilter.code);p.set('sort',logFilter.sort||'desc');return '/api/log?'+p;}
function $(id){return document.getElementById(id)}
function hdr(sec){const h={'Content-Type':'application/x-www-form-urlencoded'};const t=sec?tokens[sec]:tokens.admin;if(t)h['X-Portal-Token']=t;return h;}
function api(sec,url,opt){return fetch(url,Object.assign({headers:hdr(sec)},opt||{}));}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function colorLog(t){
t=esc(String(t||'')).replace(/\u001b\[[0-9;]*m/g,'').replace(/\r/g,'');
return t.split('\n').map(line=>{
const m=line.match(/^([EWIDV])(\s*)(\()(.*)$/);
if(!m)return line;
const cls={E:'te',W:'tw',I:'ti',D:'td',V:'tv'}[m[1]];
return '<span class='+cls+'><span class=lv>'+m[1]+'</span>'+m[2]+m[3]+m[4]+'</span>';
}).join('\n');
}
function showPin(sec,cb){pendSec=sec;const ov=$('pinOv');$('pinTitle').innerText='PIN - '+T[sec];$('pinIn').value='';ov.classList.add('show');$('pinIn').focus();
const ok=()=>{const p=$('pinIn').value;fetch('/api/unlock',{method:'POST',headers:hdr(''),body:'section='+encodeURIComponent(sec)+'&pin='+encodeURIComponent(p)}).then(r=>r.json()).then(d=>{if(d.ok){tokens[sec]=d.token;sessionStorage.setItem('portal_tokens',JSON.stringify(tokens));ov.classList.remove('show');cb();}else alert(d.error||'PIN sai');});};
$('pinOk').onclick=ok;$('pinIn').onkeydown=e=>{if(e.key==='Enter')ok();};$('pinCancel').onclick=()=>ov.classList.remove('show');}
function need(sec,fn){if(tokens[sec]){fn();return;}showPin(sec,fn);}
function attListHtml(title,rows,timeKey){
let h='<div class=att-list><h4>'+esc(title)+'</h4><ul>';
if(!rows||!rows.length)h+='<li style=color:#64748b>Không có</li>';
else rows.forEach(r=>{const tm=timeKey&&r[timeKey]?r[timeKey]:'';
h+='<li><span class=nm>'+esc(r.name||r.id||'-')+(r.id?' <code style=color:#64748b>'+esc(r.id)+'</code>':'')+'</span>'+(tm?'<span class=t>'+esc(tm)+'</span>':'')+'</li>';});
return h+'</ul></div>';
}
function attChip(label,num,badgeHtml){
return '<span class=att-chip><span class=k>'+esc(label)+'</span><span class=n>'+num+'</span>'+(badgeHtml||'')+'</span>';
}
function renderAttBlock(a){
if(!a||!a.ok)return '<div class=att-block><p class="msg error">'+(a&&a.error?esc(a.error):'Không tải được chấm công')+'</p><button class=btn id=attRefresh>Thử lại</button></div>';
const td=a.today||{};
const ar=td.arrive||a.arrive||{};
const lv=td.leave||a.leave||{};
const y=a.yesterday||{};
const n=+a.registered||0;
const tPresent=(+ar.late||0)+(+ar.ontime||0);
const tAbsent=+ar.absent||0;
const yAbsent=+y.absent||0;
const yPresent=Math.max(0,n-yAbsent);
const tdDate=td.date||ar.date||'';
return '<div class=att-block><div class=att-head>'
+'<div><h3 style="position:static;padding:0;background:0;border:0">Chấm công</h3><div class=sub style=margin:0>Giờ công '+(esc(a.work_hours||'08:30-18:00'))+'</div></div>'
+'<button class="btn-sm" id=attRefresh style=margin:0>Làm mới</button></div>'
+'<h3 style="margin-top:10px">Hôm nay <span style=color:#64748b;font-weight:400>('+esc(tdDate)+')</span></h3>'
+'<div class=att-sum>'
+attChip('Sĩ số',n,'')
+attChip('Có mặt',tPresent,'<span class="sb ok">/'+n+'</span>')
+attChip('Vắng',tAbsent,'<span class="sb bad">/'+n+'</span>')
+'</div>'
+'<h3 style="margin-top:10px">Đi làm</h3>'
+'<div class=att-sum>'
+attChip('Không đi làm',tAbsent,'<span class="sb bad">0 quẹt</span>')
+attChip('Đi muộn',ar.late||0,'<span class="sb warn">>08:30</span>')
+attChip('Đúng giờ',ar.ontime||0,'<span class="sb ok">≤08:30</span>')
+'</div><div class=att-lists>'
+attListHtml('Không đi làm',ar.absent_list,null)
+attListHtml('Đi muộn',ar.late_list,'in')
+attListHtml('Đúng giờ',ar.ontime_list,'in')
+'</div>'
+'<h3 style="margin-top:12px">Đi về</h3>'
+'<div class=att-sum>'
+attChip('Không đi làm',lv.absent||0,'')
+attChip('Quên quẹt',lv.forgot||0,'<span class="sb warn">chưa đủ ra</span>')
+attChip('Về sớm',lv.early||0,'<span class="sb warn">ra &lt;18:00 · cách ≥20p</span>')
+attChip('Về đúng giờ',lv.on_time_out||0,'<span class="sb ok">≥18:00</span>')
+'</div><div class=att-lists>'
+attListHtml('Không đi làm',lv.absent_list,null)
+attListHtml('Quên quẹt',lv.forgot_list,'in')
+attListHtml('Về sớm',lv.early_list,'out')
+attListHtml('Về đúng giờ',lv.on_time_out_list,'out')
+'</div>'
+'<h3 style="margin-top:16px">Hôm qua · Tổng quát <span style=color:#64748b;font-weight:400>('+esc(y.date||'')+')</span></h3>'
+'<div class=att-sum>'
+attChip('Sĩ số',n,'')
+attChip('Có mặt',yPresent,'<span class="sb ok">/'+n+'</span>')
+attChip('Vắng',yAbsent,'<span class="sb bad">/'+n+'</span>')
+attChip('Đi muộn',y.late||0,'')
+attChip('Về sớm',y.early||0,'')
+'</div><div class=att-lists>'
+attListHtml('Không đi làm',y.absent_list,null)
+attListHtml('Đi muộn',y.late_list,'in')
+attListHtml('Về sớm',y.early_list,'out')
+'</div></div>';
}
function bindAttRefresh(){const b=$('attRefresh');if(!b)return;b.onclick=()=>{tcClr('status');tcClr('attend');renderHome(true);};}
function renderHomeData(d,att){
const L={idle:['Ngoại tuyến','warn'],connecting:['Đang kết nối','warn'],connected:['Đã kết nối','ok'],fail:['Lỗi kết nối','bad']};
const w=L[d.wifi_status]||[d.wifi_status,'warn'];
const otaBusy=!!d.ota_busy;
const otaPct=(typeof d.ota_pct==='number'&&d.ota_pct>=0)?d.ota_pct:null;
$('body').innerHTML='<div class=grid>'
+'<div class=sc><h3>WiFi</h3><div class=v>Đã lưu: '+d.wifi_saved+' AP</div><span class="sb '+w[1]+'">'+w[0]+'</span></div>'
+'<div class=sc><h3>Địa chỉ IP</h3><div class=v>'+(esc(d.sta_ip||'—'))+'</div><span class="sb '+(d.sta_ip?'ok':'warn')+'">'+(d.sta_ip?'STA':'Chưa có')+'</span></div>'
+'<div class=sc><h3>Azure IoT</h3><div class=v>'+(d.azure_connected?'Đang hoạt động':'Mất kết nối')+'</div><span class="sb '+(d.azure_connected?'ok':'bad')+'">'+(d.azure_connected?'Đã kết nối':'Chưa kết nối')+'</span></div>'
+'<div class=sc><h3>Thẻ SD</h3><div class=v>'+(d.sd?'Đã gắn SD':'Chưa gắn SD')+'</div><span class="sb '+(d.sd?'ok':'bad')+'">'+(d.sd?'OK':'Trống')+'</span></div>'
+'<div class=sc><h3>Giờ hệ thống</h3><div class=v>'+(d.time_ok?(d.time||'Đã đồng bộ'):'Chờ WiFi + NTP')+'</div><span class="sb '+(d.time_ok?'ok':'bad')+'">'+(d.time_ok?'Đồng bộ':'Chưa có giờ')+'</span></div>'
+'<div class=sc><h3>Phiên bản FW</h3><div class=v>'+(esc(d.fw_ver||'?'))+'</div><span class="sb ok">'+(esc(d.fw_date||'?'))+'</span></div>'
+(otaBusy?('<div class=sc><h3>OTA</h3><div class=v>'+(otaPct!=null?(otaPct+'%'):'Đang tải...')+'</div><span class="sb warn">Đang cập nhật</span></div>'):'')
+'</div>'
+renderAttBlock(att);
bindAttRefresh();
if(otaBusy){clearTimeout(window._otaPoll);window._otaPoll=setTimeout(()=>{tcClr('status');renderHome(true);},2000);}
}
function renderHome(force){
if(!force){const c=tcGet('status');const a=tcGet('attend');if(c&&a){renderHomeData(c,a);return;}}
$('body').innerHTML='<p class=msg>Đang tải tổng quan...</p>';
const ctrl=new AbortController();const tid=setTimeout(()=>ctrl.abort(),20000);
Promise.all([
fetch('/api/status',{headers:hdr(''),signal:ctrl.signal}).then(r=>{if(r.status===401||r.status===403)throw Object.assign(new Error('auth'),{auth:true});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}),
fetch('/api/attendance_overview',{headers:hdr(''),signal:ctrl.signal}).then(r=>{if(r.status===401||r.status===403)throw Object.assign(new Error('auth'),{auth:true});return r.json().catch(()=>({ok:false,error:'Lỗi JSON'}));})
]).then(([d,att])=>{clearTimeout(tid);tcSet('status',d);tcSet('attend',att);renderHomeData(d,att);})
.catch(e=>{clearTimeout(tid);if(e&&e.auth){tokens={};sessionStorage.removeItem('portal_tokens');tcClr();checkLogin();return;}
if(!tokens.admin)return;$('body').innerHTML='<p class="msg error">'+(e.name==='AbortError'?'Máy chủ không phản hồi.':'Lỗi: '+(e.message||'kết nối'))+'</p><button class=btn onclick="renderHome(true)">Thử lại</button>';});
}
function renderWifi(){
$('body').innerHTML='<div style=max-width:500px><label>SSID</label><div style=display:flex;gap:8px><input id=wssid list=wl style=flex:1><button class=btn type=button id=wscan style=margin:0>Quét</button></div><datalist id=wl></datalist>'
+'<label>Mật khẩu</label><input type=password id=wpass maxlength=63><p class=msg id=wmsg></p>'

const fetchHw=()=>{api('','/api/hardware').then(r=>{if(r.status===401||r.status===403){tokens={};sessionStorage.removeItem('portal_tokens');tcClr();checkLogin();return null;}return r.json();}).then(d=>{if(!d||!d.ok){$('body').innerHTML='<p class="msg error">Lỗi tải HW</p>';return;}
const fb=b=>{b=+b||0;if(b<=0)return'0 B';const k=1024,s=['B','KB','MB','GB'],i=Math.min(s.length-1,Math.floor(Math.log(b)/Math.log(k)));return(+((b/Math.pow(k,i)).toFixed(2)))+' '+s[i];};
const fu=sec=>{const d=Math.floor(sec/86400),h=Math.floor((sec%86400)/3600),m=Math.floor((sec%3600)/60),s=sec%60;return(d?d+'d ':'')+h+'h '+m+'m '+s+'s';};
const bar=(label,used,total)=>{total=+total||0;used=Math.max(0,+used||0);const pct=total>0?Math.min(100,Math.round(used*100/total)):0;const cls=pct>=85?'bad':(pct>=70?'warn':'');
return '<div class=bar-row><div class=bar-meta><span>'+label+'</span><span><b>'+fb(used)+'</b> / '+fb(total)+' ('+pct+'% dùng)</span></div><div class=bar><i class="'+cls+'" style=width:'+pct+'%></i></div></div>';};
const intUsed=(d.internal_total||0)-(d.internal_free||0);
const spUsed=(d.spiram_total||0)-(d.spiram_free||0);
const heapUsed=(d.heap_total||0)-(d.free_heap||0);
const partUsedHint=d.partition_size||0;
$('body').innerHTML='<h3 style=font-size:14px;margin-bottom:8px>Tổng thể bộ nhớ</h3>'
+bar('Heap tổng',heapUsed,d.heap_total)
+bar('Internal RAM',intUsed,d.internal_total)
+(d.spiram_total>0?bar('PSRAM',spUsed,d.spiram_total):'<p class=hint>PSRAM: không có / không dùng</p>')
+'<p class=hint style=margin-bottom:12px>Còn trống: Internal '+fb(d.internal_free)+' (min '+fb(d.internal_min)+')'
+(d.spiram_total>0?' · PSRAM '+fb(d.spiram_free)+' (min '+fb(d.spiram_min)+')':'')
+' · DMA block lớn nhất '+fb(d.dma_largest||0)+'</p>'
+'<table class=tbl style=margin-bottom:16px><tr><th>Thông số</th><th>Giá trị</th></tr>'
+'<tr><td>Chip</td><td>'+esc(d.chip_model)+' rev '+d.revision+'</td></tr><tr><td>Cores</td><td>'+d.cores+'</td></tr><tr><td>IDF</td><td>'+esc(d.idf_ver)+'</td></tr>'
+'<tr><td>Uptime</td><td>'+fu(d.uptime_sec)+'</td></tr><tr><td>Reset</td><td><span class="sb warn">'+esc(d.reset_reason)+'</span></td></tr></table>'
+'<h3 style=font-size:14px;margin-bottom:8px>Flash & phân vùng app</h3>'
+'<table class=tbl><tr><th>Flash</th><th>Chi tiết</th></tr><tr><td>Size</td><td>'+fb(d.flash_size)+'</td></tr>'
+'<tr><td>Partition</td><td><span class="sb ok">'+esc(d.partition_label)+'</span> · '+fb(partUsedHint)+'</td></tr>'
+'<tr><td>Address</td><td>0x'+d.partition_address.toString(16).toUpperCase()+'</td></tr></table>'
+'<button class=btn id=hwRefreshBtn>Làm mới</button>';
$('hwRefreshBtn').onclick=fetchHw;}).catch(e=>{$('body').innerHTML='<p class="msg error">'+esc(e.message)+'</p><button class=btn onclick="renderHardware()">Thử lại</button>';});};
fetchHw();pollTimer=setInterval(fetchHw,5000);}
function go(sec){if(pollTimer){clearInterval(pollTimer);pollTimer=null;}cur=sec;$('title').innerText=T[sec]||sec;document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.sec===sec));$('sideMenu').classList.remove('show');$('mOv').classList.remove('show');
if(sec==='home'){renderHome();return;}if(sec==='lcd'){renderLcd();return;}if(sec==='terminal'){renderTerminal();return;}if(sec==='hardware'){renderHardware();return;}
need(sec,()=>{if(sec==='wifi')renderWifi();else if(sec==='azure')renderAzure();else if(sec==='log')renderLog();else if(sec==='cards')renderCards(false);else if(sec==='register')renderCards(true);else if(sec==='pin')renderPin();});}
function checkLogin(){const li=!!tokens.admin;$('appLayout').style.display=li?'flex':'none';$('loginPage').style.display=li?'none':'flex';$('mHdr').style.display=li?'':'none';if(!li){$('mOv').classList.remove('show');$('sideMenu').classList.remove('show');}if(li)go(cur);}
$('mBtn').onclick=()=>{$('sideMenu').classList.toggle('show');$('mOv').classList.toggle('show');};
$('mOv').onclick=()=>{$('sideMenu').classList.remove('show');$('mOv').classList.remove('show');};
document.querySelectorAll('.nav a').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.sec);});
$('logoutBtn').onclick=e=>{e.preventDefault();if(confirm('Đăng xuất?')){tokens={};sessionStorage.removeItem('portal_tokens');tcClr();checkLogin();}};
$('lbtn').onclick=()=>{const u=$('luser').value,p=$('lpass').value,btn=$('lbtn');btn.disabled=true;btn.innerHTML='<span class=spin></span>';
fetch('/api/admin_login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'user='+encodeURIComponent(u)+'&pass='+encodeURIComponent(p)})
.then(r=>r.text().then(t=>{let d;try{d=JSON.parse(t);}catch(e){throw new Error(t||('HTTP '+r.status));}return d;}))
.then(d=>{btn.disabled=false;btn.innerText='Đăng nhập';if(d.ok){tokens.admin=d.token;sessionStorage.setItem('portal_tokens',JSON.stringify(tokens));$('lmsg').innerText='';$('lmsg').className='msg';checkLogin();}else{$('lmsg').innerText=d.error||'Lỗi';$('lmsg').className='msg error';}})
.catch(e=>{btn.disabled=false;btn.innerText='Đăng nhập';$('lmsg').innerText=e.message||'Không kết nối';$('lmsg').className='msg error';});};
function doLogin(){if(!$('lbtn').disabled)$('lbtn').click();}
$('lpass').onkeydown=e=>{if(e.key==='Enter')doLogin();};$('luser').onkeydown=e=>{if(e.key==='Enter')doLogin();};
checkLogin();
</script></body></html>
